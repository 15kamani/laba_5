name: Python

on:
  push:
    branches: [ main, master ]  # Триггер на коммиты
    tags: [ 'v*.*.*' ]         # Триггер на теги (v1.0.0, v2.3.4)
  pull_request:
    branches: [ main, master ]  # Триггер на PR

jobs:
  test:  # Запуск тестов Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Укажите нужную версию

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Или poetry install/pipenv sync

      - name: Run tests
        run: pytest tests/ -v  # Или python -m unittest

  build-and-push:  # Сборка Docker (только для тегов)
    needs: test    # Ждёт успешного прохождения тестов
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')  # Только для тегов
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            your-dockerhub-username/your-python-app:latest
            your-dockerhub-username/your-python-app:${{ github.ref_name }}  # v1.0.0
          build-args: |
            PYTHON_VERSION=3.10  # Передача аргументов в Dockerfile


# для себя:
    # Тесты при коммите:
        # git add . && git commit -m "Test CI" && git push origin main
    # Сборка при теге:
        # git tag v1.0.0 && git push origin v1.0.0